services:
  - type: web
    name: maya-engage-lynk
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: MAYA_SECRET_KEY
        sync: false
      - key: MAYA_ADMIN_EMAIL
        sync: false
      - key: MAYA_ADMIN_PASSWORD
        sync: false
      - key: MAYA_HTTPS
        value: "true"
